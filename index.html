<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple to-do list app with filters, themes and saved tasks.">
    <title>To-Do List App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div id="tooltip" class="custom-tooltip" role="tooltip"></div>
    <button id="themeToggle" class="theme-toggle" type="button" aria-label="Change theme" title="Change theme">
        <i class="fas fa-adjust"></i>
    </button>

    <main class="todo-container">
        <h1>To-Do list</h1>

        <form id="taskForm" class="input-section" autocomplete="off">
            <input type="text" id="taskInput" placeholder="Add a new task..." maxlength="120" aria-label="New task" />
            <button type="submit" class="add-btn">Add</button>
        </form>
        <p id="message" class="message" role="alert"></p>

        <div class="toolbar">
            <div class="filters" role="group" aria-label="Filter tasks">
                <button type="button" class="filter-btn active" data-filter="all">All</button>
                <button type="button" class="filter-btn" data-filter="pending">Pending</button>
                <button type="button" class="filter-btn" data-filter="completed">Done</button>
            </div>
            <button type="button" id="clearCompleted" class="clear-btn">Clear done</button>
        </div>

        <ul id="taskList"></ul>
        <p id="emptyState" class="empty-state"></p>
        <p id="counter" class="counter"></p>
    </main>

    <div class="name-bar">Dev. By Danlizy Ochieng</div>

    <script src="script.js"></script>
</body>
</html>
